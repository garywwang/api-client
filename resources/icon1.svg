<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090B"/>
      <stop offset="1" stop-color="#18103A"/>
    </linearGradient>
    <linearGradient id="neon" x1="20" y1="30" x2="108" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 深色圆角底座 + 霓虹描边 -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="28.5" stroke="url(#neon)" stroke-opacity="0.35" stroke-width="3"/>

  <!-- 双向数据流 -->
  <g filter="url(#glow)" stroke="url(#neon)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Request → -->
    <path d="M 32 48 L 92 48"/>
    <path d="M 76 32 L 92 48 L 76 64"/>
    <!-- ← Response (降透明度做层次) -->
    <path d="M 96 80 L 36 80" opacity="0.55"/>
    <path d="M 52 64 L 36 80 L 52 96" opacity="0.55"/>
  </g>

  <!-- 中心数据包 -->
  <circle cx="64" cy="64" r="4" fill="#00F0FF" filter="url(#glow)"/>
</svg>