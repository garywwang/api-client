  <!-- 极速闪电 -->
  <path d="M70 30 L42 68 H62 L56 98 L88 56 H66 L70 30 Z" 
        fill="url(#g)" filter="url(#gl)"/>

  <!-- 飘散的 Payload 粒子 -->
